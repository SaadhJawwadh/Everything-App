<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Everything App: Offline-first encrypted notes, private financial ledger, cycle tracker, and zero-cloud P2P device sync.">
  <meta name="theme-color" content="#141318">

  <!-- OpenGraph & Social Metadata -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Everything App">
  <meta property="og:title" content="Everything App">
  <meta property="og:description" content="Offline-first encrypted notes, private financial ledger, cycle tracker, and zero-cloud P2P device sync.">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Everything App">
  <meta name="twitter:description" content="Offline-first encrypted notes, private financial ledger, cycle tracker, and zero-cloud P2P device sync.">

  <!-- iOS & PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Everything App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Everything App</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #141318;
      color: #F2F2F7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #launch-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: radial-gradient(circle at 50% 38%, #211E2E 0%, #141318 68%);
      transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1), visibility 220ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    #launch-splash.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-mark {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: #1E1C26;
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      place-items: center;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.45);
    }

    .splash-ring {
      width: 28px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      position: relative;
    }

    .splash-ring::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 55%;
      border-radius: 999px;
      background: #6B4EFF;
      animation: splash-slide 1.1s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    @keyframes splash-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(210%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #launch-splash {
        transition: none;
      }
      .splash-ring::after {
        animation: none;
        width: 100%;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div id="launch-splash" aria-label="Loading Everything App">
    <div class="splash-mark">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="4" y="4" width="32" height="32" rx="10" fill="#6B4EFF" fill-opacity="0.16" stroke="#6B4EFF" stroke-width="1.75"/>
        <path d="M13 15.5H27M13 20.5H23M13 25.5H19" stroke="#F2F2F7" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="25.5" cy="25.5" r="2.5" fill="#FF85C2"/>
      </svg>
    </div>
    <div class="splash-ring" role="progressbar" aria-valuetext="Loading"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('launch-splash');
      if (splash) {
        splash.classList.add('is-hidden');
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
